  "Csongrád": "Csongrád-Csanád"          # renamed 2020
  "Budapest főváros": "Budapest"
  "Bács-Kiskun megye": "Bács-Kiskun"
  # abbreviated forms used in the NNGYK weekly territorial table (page 3)
  "Bács": "Bács-Kiskun"
  "Borsod": "Borsod-Abaúj-Zemplén"
  "Győr": "Győr-Moson-Sopron"
  "Hajdú": "Hajdú-Bihar"
  "Jász": "Jász-Nagykun-Szolnok"
  "Komárom": "Komárom-Esztergom"
  "Szabolcs": "Szabolcs-Szatmár-Bereg"
  "Csongrád-Csanád": "Csongrád-Csanád"
