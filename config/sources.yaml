# Central source registry. Every collector reads its block here. Nothing about
# *where* data comes from is hard-coded in Python.
#
# Per-source keys:
#   base_url            : root used for building / resolving links
#   parser              : pdf_tables | excel | html_tables | geojson | raw | manual
#   update_frequency    : weekly | monthly | quarterly | yearly | irregular | static
#   rate_limit_seconds  : minimum delay between requests to this host (default 1.0)
#   robots_allowed      : false => collector must use `manual/` import mode, never scrape
#   render_required     : true  => needs playwright (--render) or manual download
#   resources[]         : known entry points. `status: verified | to_discover | broken`
#
# "to_discover" endpoints are resolved on the first live run; the collector writes
# the concrete URL back here (or leaves it and logs to BROKEN_LINKS.md on failure).

defaults:
  rate_limit_seconds: 1.0
  timeout_seconds: 60
  max_retries: 5
  user_agent_template: "rotavirus-research-pipeline/0.1 (+mailto:{contact_email})"

sources:

  # ------------------------------------------------------------------ NNGYK ---
  nngyk:
    description: "Nemzeti Népegészségügyi és Gyógyszerészeti Központ - rotavirus surveillance"
    base_url: "https://nngyk.gov.hu"
    parser: pdf_tables
    update_frequency: weekly
    rate_limit_seconds: 2.0
    robots_allowed: true
    render_required: true
    surveillance_break_year: 2014          # rotavirus a standalone category only from 2014
    resources:
      - key: weekly_list
        type: listing
        url: "https://nngyk.gov.hu/hu/fertozo-betegsegek/fertozo-betegsegek-heti-adatai.html"
        status: verified
        notes: "File list rendered by JS; underlying JSON endpoint to_discover."
      - key: weekly_list_json
        type: api
        url: null
        status: to_discover
        notes: "XHR/JSON behind jarvpub.nngyk.gov.hu/hu/fertozo-betegsegek-heti-adatai"
      - key: jarvpub_portal
        type: listing
        url: "https://jarvpub.nngyk.gov.hu/hu/fertozo-betegsegek-heti-adatai"
        status: verified
      - key: weekly_pdf_pattern_current
        type: pdf_pattern
        url: "https://nngyk.gov.hu/dokumentumok/fertozo_betegsegek_heti_adatai/{year}/Heti%20tajekoztato%20a%20hazai%20jarvanyugyi%20helyzetrol%20{year}.%20{week:02d}.%20het.pdf"
        status: verified
        notes: "Use ONLY when weekly_list / weekly_list_json discovery fails. Accents vary by year."
      - key: weekly_pdf_pattern_accented
        type: pdf_pattern
        url: "https://nngyk.gov.hu/dokumentumok/fertozo_betegsegek_heti_adatai/{year}/Heti%20t%C3%A1j%C3%A9koztat%C3%B3%20a%20hazai%20j%C3%A1rv%C3%A1ny%C3%BCgyi%20helyzetr%C5%91l%20{year}.%20{week:02d}.%20h%C3%A9t.pdf"
        status: verified
      - key: epinfo_weekly_pattern
        type: pdf_pattern
        url: "https://nngyk.gov.hu/dokumentumok/Epinfo/heti_szamok/{year}/honlapheti_{year}_{week:02d}.pdf"
        status: verified
        notes: "Pre-2017 sometimes capitalised 'Honlapheti_'."
      - key: annual_reports_list
        type: listing
        url: "https://nngyk.gov.hu/hu/fertozo-betegsegek/fertozo-betegsegek-eves-jelentesei.html"
        status: verified
      - key: annual_reports_list_legacy
        type: listing
        url: "https://www.antsz.hu/felso_menu/temaink/jarvany/Fertozo_betegsegek/Fertozo_eves_jelentesk"
        status: verified
      - key: osap_1561_annual
        type: pdf_set
        status: verified
        items:
          2024: "https://www.antsz.hu/data/cms114784/OSAP_Fertozo_2024_honlapra.pdf"
          2023: "https://www.antsz.hu/data/cms113436/OSAP_Fertozo_2023_honlapra.pdf"
          2022: "https://www.antsz.hu/data/cms108083/OSAP_Fertozo_2022_honlapra.pdf"
          2021: "https://www.antsz.hu/data/cms104974/OSAP_Fertozo_2021_honlapra.pdf"
          2020: "https://www.antsz.hu/data/cms100089/OSAP_Fertozo_2020_honlapra.pdf"
          2019: "https://www.antsz.hu/data/cms96760/OSAP_Fertozo_2019_honlapra.pdf"
          2018: "https://www.antsz.hu/data/cms92714/Fertozo_2018.pdf"
          2017: "https://www.antsz.hu/data/cms87738/Fertozo_2017.pdf"

