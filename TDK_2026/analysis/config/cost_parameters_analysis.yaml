# =============================================================================
# ELEMZÉSI RÉTEG – átlátható költségparaméter‑feltevések
# =============================================================================
# Ez NEM a `config/cost_parameters.yaml` helyettesítője. A pipeline magmodulja
# a szabály szerint LEÁLL, ha egy kötelező paraméter hiányzik, és soha nem
# helyettesít default számot. A TDK‑elemzéshez azonban base‑case szükséges:
# ez a fájl tételesen, forrásmegjelöléssel és megbízhatósági szinttel rögzíti
# az alap / alsó / felső értékeket, amelyeket az érzékenységvizsgálat változtat.
#
# MINDEN itteni érték `assumed` vagy `estimated`, amíg a NEAK 2025. évi
# alapdíj‑közleményéből, a 9/1993. NM r. mellékletéből és a KSH keresetadatból
# meg nem erősítik. A dolgozat "Korlátok" fejezete ezt kimondja.
#
# Mezők: base / low / high (érzékenységi tartomány), unit, evidence_class,
#        source_citation, source_url, source_year, confidence.
# -----------------------------------------------------------------------------

meta:
  base_price_year: 2025
  currency: HUF
  note: >
    A base_price_year 2025. A 2024‑es árszintű paraméterek (napi bruttó bér) a
    KSH bruttó keresetindexszel deflálva: c_valós = c_nominális · P_2025 / P_2024.

parameters:

  hbcs_base_rate:
    description: "Aktív fekvőbeteg‑ellátás alapdíja (Ft/súlyszám)"
    unit: huf_per_weight
    base: 300000
    low: 264000          # ismert 2024. évi érték
    high: 360000
    price_year: 2025
    evidence_class: assumed
    source_citation: "NEAK közlemény a fekvő‑ és járóbeteg‑szakellátás teljesítményegységeinek forintértékéről; 8/2025. (II. 6.) Korm. rendelet. A pontos 2025. évi érték a közleményből behelyettesítendő."
    source_url: "https://www.neak.gov.hu/szakmai_kozlemenyek/alapdij_kozlemeny"
    source_year: 2025
    confidence: low

  outpatient_point_value:
    description: "Járóbeteg‑szakellátás német pont forintértéke (Ft/pont)"
    unit: huf_per_point
    base: 2.0
    low: 1.6
    high: 3.0
    price_year: 2025
    evidence_class: assumed
    source_citation: "NEAK alapdíj‑közlemény, járóbeteg teljesítményegység‑díj."
    source_url: "https://www.neak.gov.hu/szakmai_kozlemenyek/alapdij_kozlemeny"
